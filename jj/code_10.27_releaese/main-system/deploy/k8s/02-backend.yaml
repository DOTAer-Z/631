# 后端：Deployment + Service（ClusterIP，名字必须叫 backend，前端 nginx 反代到 http://backend:8000）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faultdiag-backend
  namespace: faultdiagnosis
spec:
  replicas: 1                      # 入口会自动建表/seed/导入；多副本请改用一次性 Job 初始化
  selector:
    matchLabels: { app: faultdiag-backend }
  template:
    metadata:
      labels: { app: faultdiag-backend }
    spec:
      containers:
        - name: backend
          image: easzlab.io.local:5000/faultdiag-backend:release-2026-06-06   # ← 改成你的仓库/标签
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: MONGO_DB
              value: fault_diagnosis
            - name: ENABLE_EMBEDDING
              value: "False"
            - name: ENABLE_LLM
              value: "False"
            - name: AUTO_INGEST
              value: "1"
            # ── 大模型（OpenAI 兼容）：启用时把 ENABLE_LLM 改 True 并填下面三项 ──
            # - name: LLM_BASE_URL
            #   value: "http://172.30.4.43:8001/v1"
            # - name: LLM_MODEL
            #   value: "dsqwen32b"
            # - name: LLM_API_KEY
            #   value: "dummy"
            # - name: LLM_MAX_OUTPUT_TOKENS
            #   value: "1024"
            # ── Embedding（OpenAI 兼容，端点留空=未启用）──
            # - name: EMBEDDING_API_BASE
            #   value: ""
            # - name: EMBEDDING_MODEL
            #   value: ""
          envFrom:
            - secretRef: { name: faultdiag-db }   # 注入 POSTGRES_USER/PASSWORD/DB
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 120
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend                    # 不能改名：前端 nginx proxy_pass http://backend:8000
  namespace: faultdiagnosis
spec:
  selector: { app: faultdiag-backend }
  ports:
    - port: 8000
      targetPort: 8000

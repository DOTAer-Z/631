# 主系统 PostgreSQL：PVC + Deployment + Service
# Service 名固定为 postgres（backend 通过 POSTGRES_HOST=postgres 连接）
# -----------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: faultdiag-pgdata
  namespace: faultdiag-integrated
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  # storageClassName: standard   # 如集群无默认 StorageClass，取消注释并填实际 SC 名
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: faultdiag-integrated
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: REGISTRY_PLACEHOLDER/faultdiag-postgres:16   # ← 用 sed 替换
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: faultdiag-secret, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: faultdiag-secret, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: faultdiag-config, key: POSTGRES_DB } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U postgres -d fault_diagnosis"] }
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: faultdiag-pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: faultdiag-integrated
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── 主系统前端（Vue Router hash 模式）───────────────────────────────
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ /index.html;
    }

    # ── 主系统后端 API（faultdiag-backend）───────────────────────────────
    # 固定上游：docker-compose 服务名 backend，K8s 下经搜索域解析到同名 Service。
    # 不再用 BACKEND_DNS_HOST/BACKEND_PORT 环境变量拼 URL——K8s 注入的
    # BACKEND_PORT 值形如 tcp://10.x.x.x:8000，会拼出非法的 tcp:// proxy_pass。
    # /api/v1/internal/ 是集群内 LLM 网关，只在后端 pod 间经服务名 backend:8000 调用，
    # 浏览器/门户绝不能到达（已去掉共享 token 鉴权，这里必须封死外部访问）。
    location /api/v1/internal/ {
        return 404;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 故障诊断/软件状态预测走大模型，单次可能耗时较久；默认 60s 会 504。
        # 放宽读/发超时到 300s（需 ≥ 后端 LLM_TIMEOUT），连接超时 10s。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        # 日志/文件上传经此路径，放宽请求体上限
        client_max_body_size 1024m;
    }

    # =========================================================================
    # 集成方案 A：日志数据标注子系统（真·深融合，不依赖 wujie/iframe）
    # =========================================================================
    # 标注已源码级融入主系统（data-governance/annotation 下挂 13 个 view，
    # 编译进主前端 bundle），不再通过 /annotate/ 提供独立站点。
    # 原 /annotate/ → frontend-annotate 的反代块已移除，以关闭旧独立入口；
    # 融合标注的数据请求仅走下方 /annotate-api/ → backend-annotate。

    # 标注子系统后端：路径前缀重写 /annotate-api/v1/ → /api/v1/
    # 浏览器请求 /annotate-api/v1/health → backend-annotate:8000/api/v1/health
    # 用 nginx 前缀替换（location  trailing / + proxy_pass trailing /api/ 自动替换前缀）
    location /annotate-api/ {
        proxy_pass http://backend-annotate:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # 标注子系统支持上传压缩日志包 / 整文件夹，放宽到 20GB（如需更大改这里）
        client_max_body_size 20480m;
    }
}

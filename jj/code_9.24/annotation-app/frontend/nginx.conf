# 标注子系统前端 nginx 配置（容器内 :80）
# - 静态资源挂在 /annotate/，与 Vite base、vue-router base 对齐
# - SPA 回退到 /annotate/index.html
# - 不在此处反代 API：API 由主系统外层 nginx (frontend-main) 反代到 backend-annotate
#   外层路径 /annotate-api/v1/ → backend-annotate:8000/api/v1/
server {
    listen 80;
    server_name _;

    # 直接访问根路径时跳到子路径（仅独立访问该容器时生效；
    # 主系统嵌入时，所有 /annotate/* 请求由外层 nginx 转发过来，命中下面的 location）
    location = / {
        return 302 /annotate/;
    }

    # index.html 永不缓存：保证 iframe / 浏览器每次都拿到最新构建，
    # 进而引用最新的带 hash 的 JS/CSS，避免升级后仍跑旧版（如旧版的 window.open 跳转）。
    location = /annotate/index.html {
        alias /usr/share/nginx/html/annotate/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location /annotate/ {
        alias /usr/share/nginx/html/annotate/;
        index index.html;
        try_files $uri $uri/ /annotate/index.html;
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 1024;
}
